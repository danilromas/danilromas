name: Морская змейка из коммитов

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-sea.svg?color_snake=#ffd27a&color_dots=#161b22,#1d3557,#2f5d87,#3f6f9a,#8ecbff
            dist/snake-sea-light.svg?color_snake=#e08e6d&color_dots=#ebedf0,#cfe3ff,#8ecbff,#3f6f9a,#1d3557

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
