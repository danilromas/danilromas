<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2b3a67"/>
      <stop offset="45%" stop-color="#e08e6d"/>
      <stop offset="75%" stop-color="#f6c28b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="40%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3f6f9a"/><stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2f5d87"/><stop offset="100%" stop-color="#15294a"/>
    </linearGradient>
    <linearGradient id="sea3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#21466e"/><stop offset="100%" stop-color="#0d1b33"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffe2a8" stop-opacity=".9"/><stop offset="100%" stop-color="#ffe2a8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
